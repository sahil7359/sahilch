name: Supabase keepalive

# Free-tier Supabase projects pause after ~7 days of inactivity, which would
# silently break tickets. A weekly request keeps the project awake.
on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://vtoqlmctidmguhrqyleh.supabase.co/rest/v1/rate_limits?select=bucket&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_KEEPALIVE_KEY }}")
          echo "Supabase responded: $code"
          # Any response (even RLS-denied) counts as activity and keeps it awake.
